<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRON LOG</title>
  <style>
    :root {
      --primary-color: #3b82f6;
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --text-main: #1f2937;
      --text-sub: #6b7280;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 16px;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 16px;
    }

    /* 共通カード */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      padding: 16px;
      margin-bottom: 16px;
    }

    /* 1. トレーニング目標バナー */
    .training-goal-banner {
      background-color: #eff6ff;
      border-left: 4px solid var(--primary-color);
      padding: 12px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .goal-content {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .goal-label {
      font-weight: bold;
      color: var(--primary-color);
      font-size: 0.9rem;
    }
    .goal-text {
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .edit-goal-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.85rem;
    }
    .edit-goal-btn:hover {
      color: var(--primary-color);
    }

    /* 2. YouTubeカード (画像のデザイン準拠) */
    .youtube-card {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .youtube-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .channel-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .video-index {
      color: var(--primary-color);
      font-size: 1.25rem;
      font-weight: bold;
    }

    .channel-name {
      color: var(--text-main);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 4px;
    }
    .delete-btn:hover {
      color: #ef4444;
    }

    .youtube-card-body {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .thumbnail-container {
      position: relative;
      flex-shrink: 0;
      width: 120px;
      height: 68px;
      border-radius: 6px;
      overflow: hidden;
      background: #000;
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      font-size: 0.75rem;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .video-title-area {
      flex-grow: 1;
    }

    .video-title {
      font-size: 0.95rem;
      color: var(--text-main);
      margin: 0;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .complete-checkbox-btn {
      background-color: #60a5fa;
      border: none;
      border-radius: 6px;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background-color 0.2s;
    }
    .complete-checkbox-btn.completed {
      background-color: #10b981;
    }
    .complete-checkbox-btn:hover {
      opacity: 0.9;
    }

    /* 設定エリア（簡易表示） */
    .settings-section {
      margin-top: 24px;
      border-top: 1px solid #e5e7eb;
      padding-top: 16px;
    }
    .settings-section input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      margin-top: 8px;
      margin-bottom: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
    }
    .settings-section button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IRON LOG</h1>

    <!-- トレーニング目標バナー（カレンダー上部想定） -->
    <div class="training-goal-banner">
      <div class="goal-content">
        <span class="goal-label">目標:</span>
        <span id="display-goal-text" class="goal-text">今月の目標：週3回の筋トレと体重-1kg！</span>
      </div>
    </div>

    <!-- YouTube動画アイテムカード -->
    <div class="card youtube-card">
      <div class="youtube-card-header">
        <div class="channel-info">
          <span class="video-index">7</span>
          <span class="channel-name">ザ・きんにくTV 【The Muscle TV】</span>
        </div>
        <button class="delete-btn" onclick="deleteItem(this)" aria-label="削除">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>

      <div class="youtube-card-body">
        <div class="thumbnail-container">
          <!-- サムネイル画像（サンプル） -->
          <img src="https://img.youtube.com/vi/1_h4pE6jxig/hqdefault.jpg" alt="動画サムネイル" class="video-thumbnail">
          <span class="video-duration">10:50</span>
        </div>
        <div class="video-title-area">
          <p class="video-title">【下腹部＆くびれ】10種目10分間で下腹を引き締めて、くびれのある…</p>
        </div>
        <button class="complete-checkbox-btn" onclick="toggleComplete(this)" aria-label="完了">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </button>
      </div>
    </div>

    <!-- 設定画面の変更シミュレーション用 -->
    <div class="card settings-section">
      <h3>⚙️ 設定（トレーニング目標の変更）</h3>
      <label for="goal-input">目標テキスト:</label>
      <input type="text" id="goal-input" value="今月の目標：週3回の筋トレと体重-1kg！">
      <button onclick="saveGoal()">目標を保存して反映</button>
    </div>
  </div>

  <script>
    // ローカルストレージキー
    const STORAGE_KEY = 'iron_log_goal';

    // 起動時の読み込み
    window.addEventListener('DOMContentLoaded', () => {
      const savedGoal = localStorage.getItem(STORAGE_KEY);
      if (savedGoal) {
        document.getElementById('display-goal-text').textContent = savedGoal;
        document.getElementById('goal-input').value = savedGoal;
      }
    });

    // 目標保存処理（設定画面からの変更）
    function saveGoal() {
      const inputVal = document.getElementById('goal-input').value;
      if (inputVal.trim() !== '') {
        localStorage.setItem(STORAGE_KEY, inputVal);
        document.getElementById('display-goal-text').textContent = inputVal;
        alert('トレーニング目標を更新しました！');
      }
    }

    // 完了ボタンのトグル
    function toggleComplete(btn) {
      btn.classList.toggle('completed');
    }

    // 削除ボタンの処理
    function deleteItem(btn) {
      if (confirm('この項目を削除しますか？')) {
        const card = btn.closest('.youtube-card');
        card.remove();
      }
    }
  </script>

</body>
</html>
