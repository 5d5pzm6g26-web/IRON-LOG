name: Build and Deploy to GitHub Pages

# main ブランチにファイルを上げる（アップロード＝コミット）たびに自動で走ります
on:
  push:
    branches: [main]
  workflow_dispatch: {}   # 手動実行ボタンも有効化

permissions:
  contents: read
  pages: write
  id-token: write

# 同時実行を1本にまとめる（連続アップロード時に安全）
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js をセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 依存パッケージをインストール（Tailwind）
        run: npm install

      - name: Tailwind CSS をビルド
        run: npm run build:css

      - name: 公開用 index.html を生成（CDN→静的CSSに差し替え）
        run: npm run build:html

      - name: Pages 用アーティファクトをアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
